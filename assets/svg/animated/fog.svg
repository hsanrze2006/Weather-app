<?xml version="1.0" encoding="utf-8"?>
<!-- Fog icon designed to match the ammap weather SVG set in this project -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/>
      <feOffset dx="0" dy="1.5" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      @keyframes fog-drift {
        0%, 100% { transform: translateX(-2px); opacity: .85; }
        50% { transform: translateX(3px); opacity: 1; }
      }
      @keyframes fog-drift-reverse {
        0%, 100% { transform: translateX(2px); opacity: .8; }
        50% { transform: translateX(-3px); opacity: 1; }
      }
      .fog-line { animation: fog-drift 3s ease-in-out infinite; }
      .fog-line-2 { animation: fog-drift-reverse 3.6s ease-in-out infinite; }
      .fog-line-3 { animation: fog-drift 4s ease-in-out infinite; }
    ]]></style>
  </defs>
  <g filter="url(#blur)">
    <!-- Cloud silhouette uses the same blue fill and white outline as the project's other icons. -->
    <path d="M44.7 31.2c-.2-5-4.2-8.9-9.2-8.9-1.1 0-2.1.2-3.1.6-.5-4.2-4-7.4-8.3-7.4-4.6 0-8.4 3.8-8.4 8.4 0 1 .2 2 .5 2.9-4.3.2-7.7 3.8-7.7 8.1 0 4.5 3.6 8.1 8.1 8.2h19.1c5.1-.1 9.1-4.1 9-8.9z" fill="#91C0F8" stroke="white" stroke-linejoin="round" stroke-width="1.4"/>
    <!-- Moving mist lines -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path class="fog-line" d="M13 45.5h36" stroke="#57A0EE" stroke-width="3.2"/>
      <path class="fog-line-2" d="M8.5 51.5h39" stroke="#91C0F8" stroke-width="3.2"/>
      <path class="fog-line-3" d="M16 57h31" stroke="#57A0EE" stroke-width="3.2"/>
    </g>
  </g>
</svg>
